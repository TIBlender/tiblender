services:
  tiblender:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        INSTALL_BROWSER: ${INSTALL_BROWSER:-true}
    # Run as the host user so files written into the bind-mounted ./output
    # and ./viewer are owned by whoever ran `docker compose up`, not by root
    # (root-owned output cannot be cleaned or overwritten from the host, which
    # also blocks a second run into the same directory). The image's own
    # `tiblender` user is uid/gid 1000; hosts with a different id should run
    # `TIBLENDER_UID=$(id -u) TIBLENDER_GID=$(id -g) docker compose up --build`.
    user: "${TIBLENDER_UID:-1000}:${TIBLENDER_GID:-1000}"
    environment:
      # An overridden uid has no passwd entry inside the image, so HOME would
      # resolve to / (unwritable). Point it at a writable scratch directory.
      HOME: /tmp
      # LLM-backed report generation. Offline demo runs (TIBLENDER_MODE=offline,
      # the image default) fall back to deterministic heuristic reports
      # automatically and need none of this; fill in one provider profile from
      # .env.example only for a live, LLM-backed run.
      TIBLENDER_LLM_PROVIDER: ${TIBLENDER_LLM_PROVIDER:-azure_openai}
      TIBLENDER_LLM_MODEL: ${TIBLENDER_LLM_MODEL:-}
      TIBLENDER_OPENAI_BASE_URL: ${TIBLENDER_OPENAI_BASE_URL:-https://api.openai.com/v1}
      TIBLENDER_OPENAI_API_KEY: ${TIBLENDER_OPENAI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      TIBLENDER_REPORT_ENDPOINT: ${TIBLENDER_REPORT_ENDPOINT:-}
      TIBLENDER_REPORT_API_KEY: ${TIBLENDER_REPORT_API_KEY:-}
      TIBLENDER_REPORT_DEPLOYMENT: ${TIBLENDER_REPORT_DEPLOYMENT:-}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:-}
      AZURE_OPENAI_DEPLOYMENT: ${AZURE_OPENAI_DEPLOYMENT:-}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}
      AZURE_OPENAI_API_VERSION: ${AZURE_OPENAI_API_VERSION:-}
      TIBLENDER_AZURE_OPENAI_ENDPOINT: ${TIBLENDER_AZURE_OPENAI_ENDPOINT:-}
      TIBLENDER_AZURE_OPENAI_DEPLOYMENT: ${TIBLENDER_AZURE_OPENAI_DEPLOYMENT:-}
      TIBLENDER_AZURE_OPENAI_API_KEY: ${TIBLENDER_AZURE_OPENAI_API_KEY:-}
      TIBLENDER_AZURE_OPENAI_API_VERSION: ${TIBLENDER_AZURE_OPENAI_API_VERSION:-}
      # Tool/collector credentials and file-based secret aliases. Blank by
      # default; each tool degrades to fixtures/heuristics/unavailable
      # without them (see tiblender_runtime/services.py doctor report).
      NVD_API_KEY: ${NVD_API_KEY:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_API_KEY: ${GITHUB_API_KEY:-}
      X_BEARER_TOKEN: ${X_BEARER_TOKEN:-}
      TWITTER_BEARER_TOKEN: ${TWITTER_BEARER_TOKEN:-}
      X_BEARER_TOKEN_FILE: ${X_BEARER_TOKEN_FILE:-}
      TWITTER_BEARER_TOKEN_FILE: ${TWITTER_BEARER_TOKEN_FILE:-}
      X_BEARER_FALLBACK_TOKEN_FILE: ${X_BEARER_FALLBACK_TOKEN_FILE:-}
      API_KEYS_FILE: ${API_KEYS_FILE:-}
      API_KEYS_PAYPERUSE_FILE: ${API_KEYS_PAYPERUSE_FILE:-}
      API_KEYS_FALLBACK_FILE: ${API_KEYS_FALLBACK_FILE:-}
      REDDIT_ACCOUNTS_FILE: ${REDDIT_ACCOUNTS_FILE:-}
      REDDIT_CLIENT_ID: ${REDDIT_CLIENT_ID:-}
      REDDIT_CLIENT_SECRET: ${REDDIT_CLIENT_SECRET:-}
      REDDIT_EXTRA_ACCOUNTS: ${REDDIT_EXTRA_ACCOUNTS:-}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
      DISCORD_USER_TOKEN: ${DISCORD_USER_TOKEN:-}
      VIRUSTOTAL_API_KEY: ${VIRUSTOTAL_API_KEY:-}
      SEARCH_ENGINE_PROVIDER: ${SEARCH_ENGINE_PROVIDER:-searxng}
      SEARCH_ENGINE_MAX_RESULTS: ${SEARCH_ENGINE_MAX_RESULTS:-10}
      SEARXNG_BASE_URL: ${SEARXNG_BASE_URL:-http://searxng:8080}
      # Every TIBLENDER_* setting from tiblender_runtime/settings.py, so this
      # compose file is the single source of truth for what the runtime
      # reads. Values mirror Settings.from_env()'s own defaults.
      TIBLENDER_ABSORPTION_THRESHOLD: ${TIBLENDER_ABSORPTION_THRESHOLD:-0.75}
      TIBLENDER_ALLOW_HEURISTIC_REPORTS: ${TIBLENDER_ALLOW_HEURISTIC_REPORTS:-false}
      TIBLENDER_CLOCK: ${TIBLENDER_CLOCK:-auto}
      TIBLENDER_CLUSTER_EPSILON: ${TIBLENDER_CLUSTER_EPSILON:-0.08}
      TIBLENDER_COLLECT_WINDOW_HOURS: ${TIBLENDER_COLLECT_WINDOW_HOURS:-1.0}
      TIBLENDER_CONFIG_DIR: ${TIBLENDER_CONFIG_DIR:-config}
      TIBLENDER_CYCLE_INTERVAL_SECONDS: ${TIBLENDER_CYCLE_INTERVAL_SECONDS:-3600}
      TIBLENDER_DISCORD_BOT_TOKEN: ${TIBLENDER_DISCORD_BOT_TOKEN:-}
      TIBLENDER_DISCORD_MAX_CHANNELS_PER_GUILD: ${TIBLENDER_DISCORD_MAX_CHANNELS_PER_GUILD:-0}
      TIBLENDER_DISCORD_MAX_GUILDS: ${TIBLENDER_DISCORD_MAX_GUILDS:-0}
      TIBLENDER_DISCORD_USER_TOKEN: ${TIBLENDER_DISCORD_USER_TOKEN:-}
      TIBLENDER_EARLY_WARNING_THRESHOLD: ${TIBLENDER_EARLY_WARNING_THRESHOLD:-0.75}
      TIBLENDER_EMBEDDING_BACKEND: ${TIBLENDER_EMBEDDING_BACKEND:-hashing}
      TIBLENDER_EMBEDDING_DEVICE: ${TIBLENDER_EMBEDDING_DEVICE:-}
      TIBLENDER_EMBEDDING_FALLBACK: ${TIBLENDER_EMBEDDING_FALLBACK:-true}
      TIBLENDER_EMBEDDING_FEATURES: ${TIBLENDER_EMBEDDING_FEATURES:-384}
      TIBLENDER_EMBEDDING_LOCAL_FILES_ONLY: ${TIBLENDER_EMBEDDING_LOCAL_FILES_ONLY:-true}
      TIBLENDER_EMBEDDING_MODEL: ${TIBLENDER_EMBEDDING_MODEL:-BAAI/bge-large-en-v1.5}
      TIBLENDER_ENABLE_PIVOT_IOCS: ${TIBLENDER_ENABLE_PIVOT_IOCS:-true}
      TIBLENDER_ENABLE_REAL_TOOLS: ${TIBLENDER_ENABLE_REAL_TOOLS:-true}
      TIBLENDER_ENV_FILE: ${TIBLENDER_ENV_FILE:-.env}
      TIBLENDER_FIXTURES_DIR: ${TIBLENDER_FIXTURES_DIR:-fixtures}
      TIBLENDER_GITHUB_TOKEN: ${TIBLENDER_GITHUB_TOKEN:-}
      TIBLENDER_HDBSCAN_BACKEND: ${TIBLENDER_HDBSCAN_BACKEND:-sklearn}
      TIBLENDER_HISTORY_DIR: ${TIBLENDER_HISTORY_DIR:-output/history}
      TIBLENDER_INPUT_PATH: ${TIBLENDER_INPUT_PATH:-sample_runs/collector_experiment_sample/sample_run_posts.jsonl}
      TIBLENDER_JACCARD_THRESHOLD: ${TIBLENDER_JACCARD_THRESHOLD:-0.25}
      TIBLENDER_JUDGE_A_AZURE_OPENAI_API_KEY: ${TIBLENDER_JUDGE_A_AZURE_OPENAI_API_KEY:-}
      TIBLENDER_JUDGE_A_AZURE_OPENAI_API_VERSION: ${TIBLENDER_JUDGE_A_AZURE_OPENAI_API_VERSION:-}
      TIBLENDER_JUDGE_A_AZURE_OPENAI_DEPLOYMENT: ${TIBLENDER_JUDGE_A_AZURE_OPENAI_DEPLOYMENT:-}
      TIBLENDER_JUDGE_A_AZURE_OPENAI_ENDPOINT: ${TIBLENDER_JUDGE_A_AZURE_OPENAI_ENDPOINT:-}
      TIBLENDER_JUDGE_A_MODEL: ${TIBLENDER_JUDGE_A_MODEL:-}
      TIBLENDER_JUDGE_A_OPENAI_API_KEY: ${TIBLENDER_JUDGE_A_OPENAI_API_KEY:-}
      TIBLENDER_JUDGE_A_OPENAI_BASE_URL: ${TIBLENDER_JUDGE_A_OPENAI_BASE_URL:-}
      TIBLENDER_JUDGE_A_PROVIDER: ${TIBLENDER_JUDGE_A_PROVIDER:-}
      TIBLENDER_JUDGE_B_AZURE_OPENAI_API_KEY: ${TIBLENDER_JUDGE_B_AZURE_OPENAI_API_KEY:-}
      TIBLENDER_JUDGE_B_AZURE_OPENAI_API_VERSION: ${TIBLENDER_JUDGE_B_AZURE_OPENAI_API_VERSION:-}
      TIBLENDER_JUDGE_B_AZURE_OPENAI_DEPLOYMENT: ${TIBLENDER_JUDGE_B_AZURE_OPENAI_DEPLOYMENT:-}
      TIBLENDER_JUDGE_B_AZURE_OPENAI_ENDPOINT: ${TIBLENDER_JUDGE_B_AZURE_OPENAI_ENDPOINT:-}
      TIBLENDER_JUDGE_B_MODEL: ${TIBLENDER_JUDGE_B_MODEL:-}
      TIBLENDER_JUDGE_B_OPENAI_API_KEY: ${TIBLENDER_JUDGE_B_OPENAI_API_KEY:-}
      TIBLENDER_JUDGE_B_OPENAI_BASE_URL: ${TIBLENDER_JUDGE_B_OPENAI_BASE_URL:-}
      TIBLENDER_JUDGE_B_PROVIDER: ${TIBLENDER_JUDGE_B_PROVIDER:-}
      TIBLENDER_LLM_BATCH_SIZE: ${TIBLENDER_LLM_BATCH_SIZE:-20}
      TIBLENDER_LLM_CLUSTER_BATCH_SIZE: ${TIBLENDER_LLM_CLUSTER_BATCH_SIZE:-10}
      TIBLENDER_LLM_MAX_CONCURRENT: ${TIBLENDER_LLM_MAX_CONCURRENT:-8}
      TIBLENDER_CLUSTER_WORKERS: ${TIBLENDER_CLUSTER_WORKERS:-4}
      TIBLENDER_LLM_MAX_OUTPUT_TOKENS: ${TIBLENDER_LLM_MAX_OUTPUT_TOKENS:-4096}
      TIBLENDER_LLM_TEMPERATURE: ${TIBLENDER_LLM_TEMPERATURE:-0.0}
      TIBLENDER_LLM_TIMEOUT_SECONDS: ${TIBLENDER_LLM_TIMEOUT_SECONDS:-60}
      TIBLENDER_MAX_DYNAMIC_QUERIES_PER_PLATFORM: ${TIBLENDER_MAX_DYNAMIC_QUERIES_PER_PLATFORM:-30}
      TIBLENDER_MAX_EVAL_ROUNDS: ${TIBLENDER_MAX_EVAL_ROUNDS:-3}
      TIBLENDER_MAX_POSTS_PER_QUERY: ${TIBLENDER_MAX_POSTS_PER_QUERY:-100}
      TIBLENDER_MAX_QUERIES_PER_PERSPECTIVE: ${TIBLENDER_MAX_QUERIES_PER_PERSPECTIVE:-5}
      TIBLENDER_MAX_TOOL_RESULTS: ${TIBLENDER_MAX_TOOL_RESULTS:-5}
      TIBLENDER_MERGE_MAX_TIME_GAP_SECONDS: ${TIBLENDER_MERGE_MAX_TIME_GAP_SECONDS:-21600}
      TIBLENDER_MERGE_MIN_CONTEXT_OVERLAP: ${TIBLENDER_MERGE_MIN_CONTEXT_OVERLAP:-2}
      TIBLENDER_MERGE_SIMILARITY_THRESHOLD: ${TIBLENDER_MERGE_SIMILARITY_THRESHOLD:-0.92}
      TIBLENDER_MIN_CLUSTER_SIZE: ${TIBLENDER_MIN_CLUSTER_SIZE:-3}
      TIBLENDER_MIN_SAMPLES: ${TIBLENDER_MIN_SAMPLES:-2}
      TIBLENDER_MIN_SEVERITY: ${TIBLENDER_MIN_SEVERITY:-MEDIUM}
      TIBLENDER_MIN_TEXT_CHARS: ${TIBLENDER_MIN_TEXT_CHARS:-24}
      TIBLENDER_MODE: ${TIBLENDER_MODE:-offline}
      TIBLENDER_NVD_API_KEY: ${TIBLENDER_NVD_API_KEY:-}
      TIBLENDER_OCR_ENABLED: ${TIBLENDER_OCR_ENABLED:-true}
      TIBLENDER_VIRUSTOTAL_API_KEY: ${TIBLENDER_VIRUSTOTAL_API_KEY:-}
      TIBLENDER_OUTPUT_DIR: ${TIBLENDER_OUTPUT_DIR:-output}
      TIBLENDER_PASSIVE_DNS_LIMIT: ${TIBLENDER_PASSIVE_DNS_LIMIT:-20}
      TIBLENDER_PERSPECTIVE_WORKERS: ${TIBLENDER_PERSPECTIVE_WORKERS:-4}
      TIBLENDER_PIVOT_DEPTH: ${TIBLENDER_PIVOT_DEPTH:-1}
      TIBLENDER_PIVOT_MAX_RESOLUTIONS_PER_IP: ${TIBLENDER_PIVOT_MAX_RESOLUTIONS_PER_IP:-5}
      TIBLENDER_REDDIT_ACCOUNTS_FILE: ${TIBLENDER_REDDIT_ACCOUNTS_FILE:-}
      TIBLENDER_REDDIT_CLIENT_ID: ${TIBLENDER_REDDIT_CLIENT_ID:-}
      TIBLENDER_REDDIT_CLIENT_SECRET: ${TIBLENDER_REDDIT_CLIENT_SECRET:-}
      TIBLENDER_REDDIT_EXTRA_ACCOUNTS: ${TIBLENDER_REDDIT_EXTRA_ACCOUNTS:-}
      TIBLENDER_REDDIT_USER_AGENT: ${TIBLENDER_REDDIT_USER_AGENT:-tiblender/0.1}
      TIBLENDER_REFERENCE_RL_BC_BATCH_SIZE: ${TIBLENDER_REFERENCE_RL_BC_BATCH_SIZE:-32}
      TIBLENDER_REFERENCE_RL_BC_EPOCHS: ${TIBLENDER_REFERENCE_RL_BC_EPOCHS:-20}
      TIBLENDER_REFERENCE_RL_BC_LEARNING_RATE: ${TIBLENDER_REFERENCE_RL_BC_LEARNING_RATE:-0.0003}
      TIBLENDER_REFERENCE_RL_BC_PATIENCE: ${TIBLENDER_REFERENCE_RL_BC_PATIENCE:-3}
      TIBLENDER_REFERENCE_RL_BC_VALIDATION_SPLIT: ${TIBLENDER_REFERENCE_RL_BC_VALIDATION_SPLIT:-0.10}
      TIBLENDER_REFERENCE_RL_DISCOUNT: ${TIBLENDER_REFERENCE_RL_DISCOUNT:-0.99}
      TIBLENDER_REFERENCE_RL_DQN_EPISODES: ${TIBLENDER_REFERENCE_RL_DQN_EPISODES:-50}
      TIBLENDER_REFERENCE_RL_DQN_LEARNING_RATE: ${TIBLENDER_REFERENCE_RL_DQN_LEARNING_RATE:-0.0001}
      TIBLENDER_REFERENCE_RL_DROPOUT: ${TIBLENDER_REFERENCE_RL_DROPOUT:-0.10}
      TIBLENDER_REFERENCE_RL_EPSILON_DECAY: ${TIBLENDER_REFERENCE_RL_EPSILON_DECAY:-0.9}
      TIBLENDER_REFERENCE_RL_EPSILON_INIT: ${TIBLENDER_REFERENCE_RL_EPSILON_INIT:-1.0}
      TIBLENDER_REFERENCE_RL_EPSILON_MIN: ${TIBLENDER_REFERENCE_RL_EPSILON_MIN:-0.01}
      TIBLENDER_REFERENCE_RL_HIDDEN_DIM: ${TIBLENDER_REFERENCE_RL_HIDDEN_DIM:-256}
      TIBLENDER_REFERENCE_RL_REPLAY_CAPACITY: ${TIBLENDER_REFERENCE_RL_REPLAY_CAPACITY:-10000}
      TIBLENDER_REFERENCE_RL_TRAINING_MIN_TRANSITIONS: ${TIBLENDER_REFERENCE_RL_TRAINING_MIN_TRANSITIONS:-1000}
      TIBLENDER_RL_ACTION_TOP_K: ${TIBLENDER_RL_ACTION_TOP_K:-5}
      TIBLENDER_RL_MAX_STEPS: ${TIBLENDER_RL_MAX_STEPS:-10}
      TIBLENDER_RL_POLICY_BACKEND: ${TIBLENDER_RL_POLICY_BACKEND:-multiaction_dqn}
      TIBLENDER_RL_SIMILARITY_GATE: ${TIBLENDER_RL_SIMILARITY_GATE:-0.60}
      TIBLENDER_SEED: ${TIBLENDER_SEED:-20260909}
      TIBLENDER_TELEGRAM_API_HASH: ${TIBLENDER_TELEGRAM_API_HASH:-}
      TIBLENDER_TELEGRAM_API_ID: ${TIBLENDER_TELEGRAM_API_ID:-}
      TIBLENDER_TELEGRAM_MAX_CHANNELS: ${TIBLENDER_TELEGRAM_MAX_CHANNELS:-0}
      TIBLENDER_TELEGRAM_SESSION: ${TIBLENDER_TELEGRAM_SESSION:-}
      TIBLENDER_TOOL_TIMEOUT_SECONDS: ${TIBLENDER_TOOL_TIMEOUT_SECONDS:-20}
      TIBLENDER_TREND_EMBEDDING_BACKEND: ${TIBLENDER_TREND_EMBEDDING_BACKEND:-hashing}
      TIBLENDER_TREND_MIN_SIMILAR_SNAPSHOTS: ${TIBLENDER_TREND_MIN_SIMILAR_SNAPSHOTS:-4}
      TIBLENDER_TREND_SIM_THRESHOLD: ${TIBLENDER_TREND_SIM_THRESHOLD:-0.80}
      TIBLENDER_TREND_VOLUME_MIN_POSTS: ${TIBLENDER_TREND_VOLUME_MIN_POSTS:-4}
      TIBLENDER_TREND_WINDOW_HOURS: ${TIBLENDER_TREND_WINDOW_HOURS:-168}
      TIBLENDER_TWITTER_BEARER_TOKEN: ${TIBLENDER_TWITTER_BEARER_TOKEN:-}
      TIBLENDER_VOLUME_SIGMA_K: ${TIBLENDER_VOLUME_SIGMA_K:-1.5}
      TIBLENDER_TOOL_MAX_BYTES: ${TIBLENDER_TOOL_MAX_BYTES:-2097152}
      TIBLENDER_WEB_CRAWL_MAX_BYTES: ${TIBLENDER_WEB_CRAWL_MAX_BYTES:-200000}
      TIBLENDER_WEB_CRAWL_RENDER_JS: ${TIBLENDER_WEB_CRAWL_RENDER_JS:-true}
      TIBLENDER_WEB_CRAWL_WAIT_MS: ${TIBLENDER_WEB_CRAWL_WAIT_MS:-1000}
      TIBLENDER_X_BEARER_FALLBACK_TOKEN_FILE: ${TIBLENDER_X_BEARER_FALLBACK_TOKEN_FILE:-}
      TIBLENDER_X_BEARER_TOKEN: ${TIBLENDER_X_BEARER_TOKEN:-}
      TIBLENDER_X_BEARER_TOKEN_FILE: ${TIBLENDER_X_BEARER_TOKEN_FILE:-}
    volumes:
      - ./output:/app/output
      - ./viewer:/app/viewer
      # The dataset, read-only. It is not baked into the image (~95 MB
      # the pipeline itself never reads), so it is mounted instead; that is
      # what makes the evaluation script runnable on the Docker path:
      #   docker compose run --rm --entrypoint bash tiblender evaluation/run_evaluation.sh
      # The directory ships with the repository. In a checkout that does not
      # carry it, dockerd creates an empty one (see evaluation/README.md) and
      # the evaluation script says `no dataset at dataset`.
      - ./dataset:/app/dataset:ro

  searxng:
    # Dated tag pinned from Docker Hub (searxng/searxng tags, ordered by
    # last_updated) for reproducibility; only started with --profile live.
    image: searxng/searxng:2026.9.8-3fdc6d753@sha256:8bc27439bd3e201d493d1b6668c9d67a89b1d669af4d50c6f411b06c4fbc8de2
    profiles: ["live"]
    environment:
      SEARXNG_BASE_URL: ${SEARXNG_PUBLIC_BASE_URL:-http://localhost:8080/}
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
      - searxng-cache:/var/cache/searxng

  viewer:
    # Same digest-pinned base as the tiblender image; only started with
    # --profile viewer to browse ./viewer/reports_viewer_data.js locally.
    image: python:3.12-slim@sha256:2fe5997d249a808b8eeea52c58a1dbffbba28754dc11699ef5c029f2d818ce79
    profiles: ["viewer"]
    command: ["python", "-m", "http.server", "8765", "--directory", "/viewer"]
    ports:
      # Port 8765 is often already bound on a shared host;
      # TIBLENDER_VIEWER_PORT moves the host side without editing this
      # file (`TIBLENDER_VIEWER_PORT=8899 docker compose --profile viewer up viewer`).
      - "${TIBLENDER_VIEWER_PORT:-8765}:8765"
    volumes:
      - ./viewer:/viewer:ro

volumes:
  searxng-cache:
